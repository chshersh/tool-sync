name: CI

permissions:
  contents: read

on:
  pull_request:
    types: [synchronize, opened, reopened]
  push:
    branches: [appimage]
  schedule:
    # additionally run once per week (At 00:00 on Sunday) to maintain cache
    - cron: "0 0 * * 0"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # https://github.com/actions/cache/releases/tag/v4.2.3
        name: Cache cargo
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Unit tests
        run: cargo test --verbose
      - if: matrix.os != 'windows-latest'
        name: "Integration test: [unix] [sync-ripgrep]"
        env:
          SYNC_DIR: "sync-ripgrep"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir $SYNC_DIR
          cargo run -- --config=tests/$SYNC_DIR.toml ripgrep

          ls -l $SYNC_DIR

          if [[ ! -x $SYNC_DIR/rg ]]; then echo "error on: rg"; false; fi

      - if: matrix.os == 'windows-latest'
        name: "Integration test: [windows] [sync-ripgrep]"
        env:
          SYNC_DIR: "sync-ripgrep"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir $env:SYNC_DIR
          cargo run -- --config="tests\$env:SYNC_DIR.toml" ripgrep

          ls -l $env:SYNC_DIR

          if (!(Test-Path $env:SYNC_DIR\rg.exe)) {
              throw 'error on rg.exe'
          }

  linters:
    name: linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: beta
          components: clippy, rustfmt
      - name: Check clippy
        run: |
          cargo clippy --all-targets
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
